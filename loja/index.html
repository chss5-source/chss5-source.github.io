<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LOJA OLINE.</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <!-- CABEÇALHO AZUL -->
    <nav class="navbar bg-primary">
        <div class="container">

            <a class="navbar-brand text-white fw-bold" href="#">
                FRETE GRÁTIS!
            </a>

            <!-- PESQUISA -->
            <form class="d-flex" role="search">
                <input
                    class="form-control me-2"
                    type="search"
                    placeholder="Buscar produtos..."
                    aria-label="Buscar">

                <button class="btn btn-light" type="submit">
                    Buscar
                </button>
            </form>

        </div>
    </nav>


    <!-- CONTEÚDO PRINCIPAL -->
    <div class="container">

        <!-- CARROSSEL -->
        <div id="carrosselLoja"
            class="carousel slide mt-4"
            data-bs-ride="carousel">

            <div class="carousel-indicators">

                <button type="button"
                    data-bs-target="#carrosselLoja"
                    data-bs-slide-to="0"
                    class="active">
                </button>

                <button type="button"
                    data-bs-target="#carrosselLoja"
                    data-bs-slide-to="1">
                </button>

                <button type="button"
                    data-bs-target="#carrosselLoja"
                    data-bs-slide-to="2">
                </button>

            </div>

            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTYj0I9k81SIXybO1CjcjjkM5mDXBkEgCySrHnkWoy7kw&s=10"
                        class="d-block w-100"
                        alt="Bem-vindo à Loja">
                </div>

                <div class="carousel-item">
                    <img
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS7iWRPio9KtLCvrOfWh6Np8B7_RQWo9czY5L5jODJvOQ&s=10"
                        class="d-block w-100"
                        alt="Confira nossos produtos">
                </div>

                <div class="carousel-item">
                    <img
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSsq6uEec6ZDOxjLx44GQMfGeQtCD97GFbMGJYkpY7n3A&s=10"
                        class="d-block w-100"
                        alt="Encontre seu produto">
                </div>

            </div>

            <button class="carousel-control-prev"
                type="button"
                data-bs-target="#carrosselLoja"
                data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>
                <span class="visually-hidden">Anterior</span>

            </button>

            <button class="carousel-control-next"
                type="button"
                data-bs-target="#carrosselLoja"
                data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>
                <span class="visually-hidden">Próximo</span>

            </button>

        </div>


        <!-- CATEGORIAS -->
        <h2 class="mt-4 mb-3">Categorias</h2>

        <div class="row g-3">

            <div class="col-4 col-md-2">
                <div class="card text-center p-2 h-100">
                    <div class="fs-1">👕</div>
                    <p class="mb-0">Roupas</p>
                </div>
            </div>

            <div class="col-4 col-md-2">
                <div class="card text-center p-2 h-100">
                    <div class="fs-1">👟</div>
                    <p class="mb-0">Calçados</p>
                </div>
            </div>

            <div class="col-4 col-md-2">
                <div class="card text-center p-2 h-100">
                    <div class="fs-1">📱</div>
                    <p class="mb-0">Eletrônicos</p>
                </div>
            </div>

            <div class="col-4 col-md-2">
                <div class="card text-center p-2 h-100">
                    <div class="fs-1">🎧</div>
                    <p class="mb-0">Acessórios</p>
                </div>
            </div>

            <div class="col-4 col-md-2">
                <div class="card text-center p-2 h-100">
                    <div class="fs-1">🎮</div>
                    <p class="mb-0">Games</p>
                </div>
            </div>

            <div class="col-4 col-md-2">
                <div class="card text-center p-2 h-100">
                    <div class="fs-1">⌚</div>
                    <p class="mb-0">Relógios</p>
                </div>
            </div>

        </div>

        <!-- FIM DO CONTEÚDO -->

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
